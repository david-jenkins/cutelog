[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = 'cutelog'
dynamic = ["version", "readme"]
description = "GUI for Python's logging module"
requires-python = '>=3.9'
license = 'MIT'
license-files = ['LICENSE']
authors = [
  {name = 'Alexander Bus', email = 'busfromrus@gmail.com'},
]
dependencies = [
  'qtpy',
  'jsonstream == 0.0.1',
]
keywords=["log", "logging", "gui", "qt"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Environment :: MacOS X :: Cocoa",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Logging",
    "Topic :: System :: Monitoring",
]

[project.urls]
source = "https://github.com/busimus/cutelog/"
download = "https://github.com/busimus/cutelog/releases"

[project.gui-scripts]
cutelog = "cutelog.__main__:main"

[tool.setuptools.packages.find]
where = ["."]  # list of folders that contain the packages (["."] by default)
include = ["cutelog*"]  # package names should match these glob patterns (["*"] by default)
exclude = []  # exclude packages matching these glob patterns (empty by default)
namespaces = true  # to disable scanning PEP 420 namespaces (true by default)

[tool.setuptools.package-data]
"cutelog.resources.icons.dark_theme" = ["*.svg"]
"cutelog.resources.icons.light_theme" = ["*.svg"]
"cutelog.resources.images" = ["*.png"]
"cutelog.resources.ui" = ["*.ui"]
"cutelog.resources" = ["*.qss"]

[tool.setuptools.dynamic]
version = {attr = "cutelog.__version__"}  # any module attribute compatible with ast.literal_eval
readme = {file = ["README.md", "README.rst"]}